name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ '*' ]
  workflow_call:

  # Allow manually trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip
  TAG_PREFIX: v

jobs:
  build-and-package:
    name: Build and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - name: macOS x64
            os: macos-latest
            rid: osx-x64
            archive: tar.gz
          - name: macOS Arm64
            os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$env:GITHUB_REF_NAME' is not a supported semantic version."
            }

            $version = $Matches.version
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved build version: $version"
      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore AzHST.slnx --verbosity minimal
      - name: Build solution
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          dotnet build AzHST.slnx `
            --configuration Release `
            --no-restore `
            --verbosity minimal `
            -p:ContinuousIntegrationBuild=true `
            "-p:Version=$env:BUILD_VERSION"
      - name: Run tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          dotnet test AzHST.slnx `
            --configuration Release `
            --no-build `
            --no-restore `
            --verbosity minimal `
            -p:ContinuousIntegrationBuild=true `
            "-p:Version=$env:BUILD_VERSION"
      - name: Verify formatting
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: dotnet format AzHST.slnx --verify-no-changes --no-restore --verbosity minimal
      - name: Publish and package application
        id: package
        shell: pwsh
        env:
          ARCHIVE_KIND: ${{ matrix.archive }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $project = Join-Path (Join-Path "src" "AzHST.Desktop") "AzHST.Desktop.csproj"
          $baseName = "AzHST-$env:BUILD_VERSION-$env:RUNTIME_IDENTIFIER"
          $publishDirectory = Join-Path $env:RUNNER_TEMP $baseName

          dotnet restore $project `
            --runtime $env:RUNTIME_IDENTIFIER `
            --verbosity minimal

          dotnet publish $project `
            --configuration Release `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=true `
            --no-restore `
            --output $publishDirectory `
            -p:ContinuousIntegrationBuild=true `
            "-p:Version=$env:BUILD_VERSION"

          $projectDirectory = Split-Path -Parent $project
          $buildAssemblyPath = [IO.Path]::Combine(
            $projectDirectory,
            "bin",
            "Release",
            "net10.0",
            $env:RUNTIME_IDENTIFIER,
            "AzHST.Desktop.dll")
          $executableName = if ($env:RUNTIME_IDENTIFIER.StartsWith("win-", [StringComparison]::Ordinal)) {
            "AzHST.Desktop.exe"
          } else {
            "AzHST.Desktop"
          }
          $executablePath = Join-Path $publishDirectory $executableName
          $resourceDirectory = Join-Path $publishDirectory "resources"
          $themeDirectory = Join-Path $resourceDirectory "themes"
          $iconDirectory = Join-Path $resourceDirectory "azure-icons"
          $copilotRuntimeName = if ($env:RUNTIME_IDENTIFIER.StartsWith("win-", [StringComparison]::Ordinal)) {
            "copilot-runtime.exe"
          } else {
            "copilot-runtime"
          }
          $copilotRuntimePath = [IO.Path]::Combine(
            $publishDirectory,
            "runtimes",
            $env:RUNTIME_IDENTIFIER,
            "native",
            $copilotRuntimeName)

          if (-not (Test-Path -LiteralPath $buildAssemblyPath -PathType Leaf)) {
            throw "Build output assembly was not found at '$buildAssemblyPath'."
          }
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Published executable was not found at '$executablePath'."
          }
          if (-not (Test-Path -LiteralPath $copilotRuntimePath -PathType Leaf)) {
            throw "Published package does not contain the Copilot runtime wrapper at '$copilotRuntimePath'."
          }
          if (-not (Get-ChildItem -LiteralPath $themeDirectory -Filter "*.json" -File -Recurse | Select-Object -First 1)) {
            throw "Published package does not contain theme resources."
          }
          if (-not (Get-ChildItem -LiteralPath $iconDirectory -Filter "*.svg" -File -Recurse | Select-Object -First 1)) {
            throw "Published package does not contain Azure icon resources."
          }

          $productVersion = (Get-Item -LiteralPath $buildAssemblyPath).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion)) {
            throw "Build output assembly does not contain product version metadata."
          }
          if (-not $productVersion.StartsWith($env:BUILD_VERSION, [StringComparison]::Ordinal)) {
            throw "Published product version '$productVersion' does not start with '$env:BUILD_VERSION'."
          }

          if ($env:ARCHIVE_KIND -eq "zip") {
            $archivePath = Join-Path $env:RUNNER_TEMP "$baseName.zip"
            Compress-Archive `
              -LiteralPath $publishDirectory `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal
          } elseif ($env:ARCHIVE_KIND -eq "tar.gz") {
            $archivePath = Join-Path $env:RUNNER_TEMP "$baseName.tar.gz"
            $publishParent = Split-Path -Parent $publishDirectory
            $publishLeaf = Split-Path -Leaf $publishDirectory
            tar -czf $archivePath -C $publishParent $publishLeaf
          } else {
            throw "Unsupported archive kind '$env:ARCHIVE_KIND'."
          }

          $checksumPath = "$archivePath.sha256"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveName = Split-Path -Leaf $archivePath
          Set-Content -LiteralPath $checksumPath -Value "$hash  $archiveName" -NoNewline

          "package_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
      - name: Upload application package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AzHST-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  semantic-release-dry-run:
    name: Semantic release dry run
    runs-on: ubuntu-latest
    needs: build-and-package
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Analyze the next release
        id: semrelease
        uses: btnguyen2k/action-semrelease@v4.0.0
        with:
          dry-run: true
          auto-mode: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-major-release: false
          tag-minor-release: false
          branches: ${{ github.ref_name }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          tag-only: true
      - name: Verify semantic release result
        shell: pwsh
        env:
          RELEASE_RESULT: ${{ steps.semrelease.outputs.result }}
          RELEASE_VERSION: ${{ steps.semrelease.outputs.releaseVersion }}
        run: |
          if ($env:RELEASE_RESULT -notin @("SUCCESS", "SKIPPED")) {
            throw "Semantic release dry run returned '$env:RELEASE_RESULT'."
          }

          Write-Host "Semantic release result: $env:RELEASE_RESULT"
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            Write-Host "Candidate release version: $env:RELEASE_VERSION"
          }
