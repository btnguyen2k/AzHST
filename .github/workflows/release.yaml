# Automatically release a new version when a PR is merged to branch `release`

name: 'Selease'

on:
  pull_request:
    types: [ closed ]
    branches: [ release ]

env:
  BRANCH_TO_RELEASE: 'release'
  TAG_PREFIX: 'v'
  FILE_CHANGELOG: 'RELEASE-NOTES.md'

jobs:
  call-ci:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  semantic-release-dry-run:
    name: Semantic release dry run
    runs-on: ubuntu-latest
    needs: [ call-ci ]
    if: github.event.pull_request.merged == true
    outputs:
      RESULT: ${{ steps.semrelease.outputs.result }}
      VERSION: ${{ steps.semrelease.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.semrelease.outputs.releaseNotes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Analyze the next release
        id: semrelease
        uses: btnguyen2k/action-semrelease@v4.0.0
        with:
          dry-run: true
          auto-mode: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-major-release: false
          tag-minor-release: false
          branches: ${{ github.ref_name }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          tag-only: true
      - name: Verify semantic release result
        shell: pwsh
        env:
          RELEASE_RESULT: ${{ steps.semrelease.outputs.result }}
          RELEASE_VERSION: ${{ steps.semrelease.outputs.releaseVersion }}
        run: |
          if ($env:RELEASE_RESULT -notin @("SUCCESS", "SKIPPED")) {
            throw "Semantic release dry run returned '$env:RELEASE_RESULT'."
          }

          Write-Host "Semantic release result: $env:RELEASE_RESULT"
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            Write-Host "Candidate release version: $env:RELEASE_VERSION"
          }

  update-meta-data:
    runs-on: ubuntu-latest
    needs: [ semantic-release-dry-run ]
    if: github.event.pull_request.merged == true
    permissions:
      contents: write # to be able to publish a GitHub release
    outputs:
      RESULT: ${{ needs.semantic-release-dry-run.outputs.RESULT }}
      VERSION: ${{ needs.semantic-release-dry-run.outputs.VERSION }}
      RELEASE_NOTES: ${{ needs.semantic-release-dry-run.outputs.RELEASE_NOTES }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Update release notes and version info
        run: |
          RESULT='${{ needs.semantic-release-dry-run.outputs.RESULT }}'
          VERSION='${{ needs.semantic-release-dry-run.outputs.VERSION }}'
          RELEASE_NOTES='${{ needs.semantic-release-dry-run.outputs.RELEASE_NOTES }}'

          echo "🕘 Updating module meta..."
          echo "   - RESULT: ${RESULT}"
          echo "   - VERSION: ${VERSION}"
          echo "   - RELEASE_NOTES: ${RELEASE_NOTES}"

          if [ "${RESULT}" == "SUCCESS" ]; then
            DATE=`date +%Y-%m-%d`
            head -1 ${FILE_CHANGELOG} > .temp.md
            echo -e "\n## ${DATE} - v${VERSION}\n\n${RELEASE_NOTES}" >> .temp.md
            tail -n +2 ${FILE_CHANGELOG} >> .temp.md
            mv -f .temp.md ${FILE_CHANGELOG}
            echo ========== content of ${FILE_CHANGELOG} ==========
            cat ${FILE_CHANGELOG}

            echo ========== update .md files ==========
            sed -i -E "s/<<VERSION>>/v${VERSION}/" ./*.md

            echo ========== update VERSION info in AzHST.Desktop.csproj ==========
            sed -i -E "s/\<Version\>0.0.0\</Version\>/\<Version\>${VERSION}\</Version\>/" src/AzHST.Desktop/AzHST.Desktop.csproj

            echo ========== commit updates ==========
            git config --global user.email "<>"
            git config --global user.name "CI Build"
            git commit -am "Update ${FILE_CHANGELOG}, *.md files and version info in AzHST.Desktop for new version ${VERSION}"
            git push origin ${BRANCH_TO_RELEASE}

            echo ========== tag ==========
            git tag -f -a "${TAG_PREFIX}${VERSION}" -m "Release ${TAG_PREFIX}/v${VERSION}"
            git push origin "${TAG_PREFIX}${VERSION}" -f
            echo "✅ Done."
          else
            echo "❎ SKIPPED."
          fi

  # TODO:

  # step: package application as standalone binary for Windows

  # step: package the source code as a .zip artifact

  # step: create a release, using version info as tag, also attach the source code artifact and the application binary for Windows
